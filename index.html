<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF14 纷争前线轮换日历</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a202c, #2d3748);
            min-height: 100vh;
            padding: 30px 20px;
            color: #e2e8f0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .title {
            text-align: center;
            font-size: 26px;
            margin-bottom: 15px;
            color: #f6e05e;
        }

        /* 月份切换按钮 */
        .month-control {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .month-btn {
            padding: 8px 16px;
            background: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }

        .month-btn:hover {
            background: #4299e1;
        }

        .current-month {
            font-size: 18px;
            color: #fff;
            font-weight: bold;
        }

        /* 日历网格 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 12px;
            margin-bottom: 40px;
        }

        .day-card {
            border-radius: 12px;
            padding: 18px;
            border-width: 2px;
            border-style: solid;
            transition: 0.3s;
            background: rgba(0,0,0,0.3);
            text-align: center;
        }

        .day-card:hover {
            transform: translateY(-3px);
        }

        /* 今日高亮 */
        .today {
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
        }

        .day-num {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
        }

        .day-name {
            font-size: 14px;
            line-height: 1.4;
        }

        /* 战场专属颜色 */
        .color-尘封 { border-color: #f6c450; } /* 黄色 */
        .color-碎冰 { border-color: #60a5fa; } /* 蓝色 */
        .color-草原 { border-color: #4ade80; } /* 绿色 */
        .color-沃刻 { border-color: #f8fafc; } /* 白色 */
        .color-阵地 { border-color: #b97c50; } /* 棕色 */

        /* 底部署名 & 时间 */
        .footer {
            text-align: center;
            font-size: 14px;
            color: #a0aec0;
            padding: 10px 0;
        }
        .now-time {
            text-align: center;
            font-size: 13px;
            color: #718096;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="title" id="mainTitle">FF14 纷争前线轮换日历</h2>

    <!-- 月份切换按钮 -->
    <div class="month-control">
        <button class="month-btn" onclick="prevMonth()">← 上个月</button>
        <div class="current-month" id="monthLabel">2026年5月</div>
        <button class="month-btn" onclick="nextMonth()">下个月 →</button>
    </div>

    <div id="calendar" class="calendar-grid"></div>

    <!-- 底部署名 -->
    <div class="footer">
        牢房查看器没更新，代码由豆包老师提供。by:蠹毒@白银乡
    </div>
    <!-- 实时当前时间 -->
    <div class="now-time" id="nowTime"></div>
</div>

<script>
// 战场轮换 + 配色
const ROTATION = [
    { name: "尘封秘岩（争夺战）", color: "color-尘封" },
    { name: "荣誉野（碎冰战）", color: "color-碎冰" },
    { name: "昂萨哈凯尔（竞争战）", color: "color-草原" },
    { name: "沃刻其特（演习战）", color: "color-沃刻" },
    { name: "尘封秘岩（争夺战）", color: "color-尘封" },
    { name: "周边遗迹群（阵地战）", color: "color-阵地" },
    { name: "昂萨哈凯尔（竞争战）", color: "color-草原" },
    { name: "沃刻其特（演习战）", color: "color-沃刻" },
];

// 基准日期
const BASE_DATE = new Date(2026, 4, 7);
const BASE_INDEX = 5;

// 当前显示的年月
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth() + 1;

// 加载日历
function loadCalendar() {
    document.getElementById("monthLabel").innerText = `${currentYear}年${currentMonth}月`;

    const year = currentYear;
    const month = currentMonth;
    const today = new Date().getDate();
    const nowYear = new Date().getFullYear();
    const nowMonth = new Date().getMonth() + 1;

    const firstDay = new Date(year, month - 1, 1);
    const diffDays = Math.floor((firstDay - BASE_DATE) / 86400000);
    let startIndex = (BASE_INDEX + diffDays) % 8;
    if (startIndex < 0) startIndex += 8;

    const daysInMonth = new Date(year, month, 0).getDate();
    const cal = document.getElementById("calendar");
    cal.innerHTML = "";

    for (let d = 1; d <= daysInMonth; d++) {
        const idx = (startIndex + d - 1) % 8;
        const data = ROTATION[idx];
        
        const card = document.createElement("div");
        card.className = `day-card ${data.color}`;
        
        if (year === nowYear && month === nowMonth && d === today) {
            card.classList.add("today");
        }

        card.innerHTML = `
            <div class="day-num">${d}日</div>
            <div class="day-name">${data.name}</div>
        `;
        cal.appendChild(card);
    }
}

// 上个月
function prevMonth() {
    currentMonth--;
    if (currentMonth < 1) {
        currentMonth = 12;
        currentYear--;
    }
    loadCalendar();
}

// 下个月
function nextMonth() {
    currentMonth++;
    if (currentMonth > 12) {
        currentMonth = 1;
        currentYear++;
    }
    loadCalendar();
}

// 更新实时时间
function updateTime(){
    let now = new Date();
    let h = now.getHours().toString().padStart(2,'0');
    let m = now.getMinutes().toString().padStart(2,'0');
    let s = now.getSeconds().toString().padStart(2,'0');
    document.getElementById("nowTime").innerText = "当前系统时间：" + h + ":" + m + ":" + s;
}

// 初始化
window.onload = function () {
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth() + 1;
    loadCalendar();
    updateTime();
    setInterval(updateTime, 1000);
};
</script>

</body>
</html>
