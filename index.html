<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FF14 纷争前线轮换日历</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a202c, #2d3748);
            min-height: 100vh;
            padding: 20px 15px;
            color: #e2e8f0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 15px;
            color: #f6e05e;
        }

        .control-wrap {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .month-control {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .export-control {
            text-align: center;
        }

        .month-btn, .export-btn {
            padding: 7px 14px;
            background: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .month-btn:hover, .export-btn:hover {
            background: #4299e1;
        }

        .export-btn {
            background: #38b2ac;
        }
        .export-btn:hover {
            background: #4fd1c5;
        }

        .current-month {
            font-size: 16px;
            color: #fff;
            font-weight: bold;
        }

        /* 用于截图的日历容器 */
        #calendar {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }

        .day-card {
            border-radius: 12px;
            padding: 15px 8px;
            border-width: 2px;
            border-style: solid;
            transition: 0.3s;
            background: rgba(0,0,0,0.3);
            text-align: center;
        }

        .day-card:hover {
            transform: translateY(-2px);
        }

        .today {
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
        }

        .day-num {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #fff;
        }

        .day-name {
            font-size: 13px;
            line-height: 1.4;
        }

        .color-尘封 { border-color: #f6c450; }
        .color-碎冰 { border-color: #60a5fa; }
        .color-草原 { border-color: #4ade80; }
        .color-沃刻 { border-color: #f8fafc; }
        .color-阵地 { border-color: #b97c50; }

        .footer {
            text-align: center;
            font-size: 13px;
            color: #a0aec0;
            padding: 8px 0;
        }
        .now-time {
            text-align: center;
            font-size: 12px;
            color: #718096;
            margin-bottom: 15px;
        }

        @media (max-width: 480px) {
            #calendar {
                grid-template-columns: repeat(2, 1fr);
            }
            .title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="title" id="mainTitle">FF14 纷争前线轮换日历</h2>

    <div class="control-wrap">
        <div class="month-control">
            <button class="month-btn" onclick="prevMonth()">← 上个月</button>
            <div class="current-month" id="monthLabel">2026年5月</div>
            <button class="month-btn" onclick="nextMonth()">下个月 →</button>
        </div>
        <div class="export-control">
            <button class="export-btn" onclick="exportCalendarImage()">📷 导出本月日历为图片</button>
        </div>
    </div>

    <!-- 截图区域：只包含日历卡片 -->
    <div id="captureWrap">
        <div id="calendar"></div>
    </div>

    <!-- 以下内容不会被导出 -->
    <div class="footer">
        牢房查看器没更新，代码由豆包老师提供。by:蠹毒@白银乡
    </div>
    <div class="now-time" id="nowTime"></div>
</div>

<script>
const ROTATION = [
    { name: "尘封秘岩（争夺战）", color: "color-尘封" },
    { name: "荣誉野（碎冰战）", color: "color-碎冰" },
    { name: "昂萨哈凯尔（竞争战）", color: "color-草原" },
    { name: "沃刻其特（演习战）", color: "color-沃刻" },
    { name: "尘封秘岩（争夺战）", color: "color-尘封" },
    { name: "周边遗迹群（阵地战）", color: "color-阵地" },
    { name: "昂萨哈凯尔（竞争战）", color: "color-草原" },
    { name: "沃刻其特（演习战）", color: "color-沃刻" },
];

const BASE_DATE = new Date(2026, 4, 7);
const BASE_INDEX = 5;

let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth() + 1;

function loadCalendar() {
    document.getElementById("monthLabel").innerText = `${currentYear}年${currentMonth}月`;

    const year = currentYear;
    const month = currentMonth;
    const today = new Date().getDate();
    const nowYear = new Date().getFullYear();
    const nowMonth = new Date().getMonth() + 1;

    const firstDay = new Date(year, month - 1, 1);
    const diffDays = Math.floor((firstDay - BASE_DATE) / 86400000);
    let startIndex = (BASE_INDEX + diffDays) % 8;
    if (startIndex < 0) startIndex += 8;

    const daysInMonth = new Date(year, month, 0).getDate();
    const cal = document.getElementById("calendar");
    cal.innerHTML = "";

    for (let d = 1; d <= daysInMonth; d++) {
        const idx = (startIndex + d - 1) % 8;
        const data = ROTATION[idx];
        
        const card = document.createElement("div");
        card.className = `day-card ${data.color}`;
        
        if (year === nowYear && month === nowMonth && d === today) {
            card.classList.add("today");
        }

        card.innerHTML = `
            <div class="day-num">${d}日</div>
            <div class="day-name">${data.name}</div>
        `;
        cal.appendChild(card);
    }
}

function prevMonth() {
    currentMonth--;
    if (currentMonth < 1) {
        currentMonth = 12;
        currentYear--;
    }
    loadCalendar();
}

function nextMonth() {
    currentMonth++;
    if (currentMonth > 12) {
        currentMonth = 1;
        currentYear++;
    }
    loadCalendar();
}

// 导出日历为图片 (白底，无底部文字)
function exportCalendarImage() {
    const target = document.getElementById("captureWrap");
    const fileName = `${currentYear}年${currentMonth}月_FF14纷争前线日历.png`;

    html2canvas(target, {
        scale: 2,
        backgroundColor: "#ffffff" // 白色背景
    }).then(canvas => {
        const link = document.createElement("a");
        link.download = fileName;
        link.href = canvas.toDataURL("image/png");
        link.click();
    });
}

// 北京时间
function updateTime(){
    let now = new Date();
    let beijingTime = new Date(now.getTime() + (8 * 60 * 60 * 1000));
    let h = beijingTime.getUTCHours().toString().padStart(2,'0');
    let m = beijingTime.getUTCMinutes().toString().padStart(2,'0');
    let s = beijingTime.getUTCSeconds().toString().padStart(2,'0');
    document.getElementById("nowTime").innerText = "当前北京时间：" + h + ":" + m + ":" + s;
}

window.onload = function () {
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth() + 1;
    loadCalendar();
    updateTime();
    setInterval(updateTime, 1000);
};
</script>

</body>
</html>
